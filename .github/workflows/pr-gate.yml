# public-gate v0.2.0 ── 門 1（進門）：外人的 PR 動到敏感檔就等擁有者：對最新 commit 按 Approve，再重跑這一格（或貼 owner-approved 觸發）。正本在擁有者的私有工具庫。
# 🔴 這支刻意用 pull_request_target：規則要從「我們的 main」讀，不能讓 PR 自己帶來的版本說了算。
#    安全前提（不得改）：只 checkout 我們的 main（不指定 ref）、絕不 checkout 或執行 PR 的程式、
#    不給任何 secret；PR 動了哪些檔用 GitHub API 問。權限只有讀內容＋貼標籤。
name: public-gate 進門檢查
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
# 同一個 PR 只留最新一次檢查（核准與 commit 一律現查，不信事件快照）
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .public-gate/pr-gate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
